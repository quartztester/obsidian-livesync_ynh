; Managed by YunoHost — edits are overwritten on every install/upgrade.
; Mirrors the settings of upstream's couchdb-init provision script
; (https://github.com/vrtmrz/obsidian-livesync/blob/main/utils/couchdb/couchdb-init.sh).

[couchdb]
database_dir = __DATA_DIR__
view_index_dir = __DATA_DIR__
max_document_size = 50000000

[chttpd]
port = __PORT__
bind_address = 127.0.0.1
require_valid_user = true
enable_cors = true
; Obsidian attachments and bulk revisions ride on single requests
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer, x-couch-session-id, x-couch-csrf-token
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600

[log]
writer = file
file = __LOG_PATH__
level = info
