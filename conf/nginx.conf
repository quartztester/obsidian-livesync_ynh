#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__/;

  include proxy_params_no_auth;
  proxy_redirect off;

  # Vault attachments and bulk replication arrive as large single requests
  # (CouchDB is capped server-side at 4G via chttpd/max_http_request_size).
  client_max_body_size 512M;
  proxy_request_buffering off;
  proxy_read_timeout 300;
  proxy_send_timeout 300;
  proxy_connect_timeout 300;

  # LiveSync holds continuous replication changfeeds open
  proxy_buffering off;
}
